  F9b: {base: B5, index_dir: build/index_f9b, compare_to: F9a, desc: "Санамсаргүй сонгосон 100 тэмдэглэгээг нэмсэн (F9a-тай харьцуулна)", group: F}
  F10: {base: D1, adapter: f10, search_values_tool: true, models: [sqrl-9b], desc: "sqrl + search_values tool (tool-той траектороор сургасан, D-ийн жор)", group: F}

  # ---------------- G: agentic систем (төлөвлөгөөнөөс гадуурх нэмэлт; text2sql-thesis-ийн Planner → Writer → Critic)
  # Нэг удаад нэг өөрчлөлт: G1 = суурь + agent давталт; G2/G3 нь G1-ээс нэг зүйлээр ялгаатай. docs/AGENT.md
  G1: {base: "${best_config}", agent: true, desc: "Agent: гүйцэтгэл ба литерал шалгах tool → LLM critic → засах (≤2 удаа)", group: G}
  G2: {base: G1, agent_critic: false, desc: "G1 − LLM critic (зөвхөн детерминист tool-ийн олдвороор засна)", group: G}
  G3: {base: G1, agent_plan: true, desc: "G1 + planner (SQL-ээс өмнө англи төлөвлөгөө)", group: G}
  G4: {base: "${best_a}", agent: true, desc: "RAG-гүй agent: A-шилдэг + G1-ийн давталт", group: G}
  G5: {base: G1, agent_literal_check: false, desc: "G1 − литерал tool (утга шалгах DB tool-ийн нэмэр = G1 − G5)", group: G}
  G6: {base: G2, agent_literal_check: false, desc: "G2 − литерал tool = зөвхөн гүйцэтгэлийн алдаагаар нэмэлт засвар (agent-гүй давталтын суурь)", group: G}
