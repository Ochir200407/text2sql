# =====================================================================
# Semantic model — t2s схемийн мэдлэгийн давхарга (зааврын 2-р хэсэг, B1 туршилт)
# ---------------------------------------------------------------------
# Хүснэгт/багана бүрд: монгол (mn) ба англи (en) тайлбар, синоним (кирилл; латин галигийг
# normalizer автоматаар үүсгэнэ), enum утгын монгол нэр (values), хувийн мэдээлэл (pii).
# Identifier-ууд англиар үлдэнэ (зааврын 4-р хэсэг: "Схемийг англиар үлдээж, монгол тайлбар,
# синоним нэм"). Жишээ утга (examples)-ыг index-build DB-ээс автоматаар нэмнэ (pii биш баганад).
# Багана: {mn, en, syn: [...], values: {КОД: монгол нэр}, pii: true, fk: хүснэгт.багана}
# =====================================================================
version: 1
schema: t2s
dialect: postgresql
notes_mn:
  - "Өгөгдлийн 'өнөөдөр' (системийн ажлын өдөр) = t2s.business_date() = 2026-06-30. CURRENT_DATE-ийг ч ашиглаж болно."
  - "Мөнгөн дүн тухайн мөрийн валютаар (currency_code). Олон валютыг нэгтгэхдээ *_mnt баганыг ашиглана; *_mnt багангүй хүснэгтэд (loan_payments, collection_cases, collaterals ...) t2s.fx_to_mnt(currency_code, огноо) функцээр (тухайн өдөр эсвэл түүнээс өмнөх сүүлийн ханш) хөрвүүлнэ."
  - "Огноо бүхий асуулт (сар, улирал, жил) date_trunc эсвэл EXTRACT ашиглана."

tables:
  # ------------------------------------------------------------------ байгууллага
  branches:
    mn: "Салбар: төв оффис, салбар, тооцооны төв, дижитал салбар"
    en: "Branches of the NBFI (head office, branches, sub-branches, digital branch)"
    syn: [салбар, салбарууд, нэгж, тооцооны төв, branch]
    pk: branch_id
    columns:
      branch_id: {mn: "Салбарын дотоод ID", en: "Branch id"}
      branch_code: {mn: "Салбарын код (UB01, DR01 ...)", en: "Branch code", syn: [салбарын код]}
      branch_name: {mn: "Салбарын нэр", en: "Branch name", syn: [салбарын нэр]}
      branch_type: {mn: "Салбарын төрөл", en: "Branch type",
                    values: {HEAD_OFFICE: Төв оффис, BRANCH: Салбар, SUB_BRANCH: Тооцооны төв, DIGITAL: Дижитал салбар}}
      parent_branch_id: {mn: "Харьяалагдах дээд салбар", en: "Parent branch id", fk: branches.branch_id}
      province: {mn: "Аймаг/хот", en: "Province or city", syn: [аймаг, хот, байршил]}
      district: {mn: "Сум/дүүрэг", en: "District or soum", syn: [дүүрэг, сум]}
      opened_date: {mn: "Нээгдсэн огноо", en: "Opening date", syn: [нээгдсэн]}
      closed_date: {mn: "Хаагдсан огноо (идэвхтэй бол NULL)", en: "Closing date"}
      is_active: {mn: "Идэвхтэй ажиллаж байгаа эсэх", en: "Is active"}

  employees:
    mn: "Ажилтан: зээлийн мэргэжилтэн, салбарын менежер, кассчин, эргэн төлөлтийн ажилтан гэх мэт"
    en: "Employees (credit officers, branch managers, tellers, collectors, ...)"
    syn: [ажилтан, ажилчид, зээлийн мэргэжилтэн, мэргэжилтэн, менежер, кассчин, employee, officer]
    pk: employee_id
    columns:
      employee_id: {mn: "Ажилтны дотоод ID", en: "Employee id"}
      employee_no: {mn: "Ажилтны дугаар (E0001)", en: "Employee number"}
      first_name: {mn: "Нэр", en: "First name", syn: [нэр]}
      last_name: {mn: "Овог (эцгийн нэр)", en: "Last name (patronymic)", syn: [овог]}
      full_name: {mn: "Овог нэр", en: "Full name", syn: [бүтэн нэр]}
      branch_id: {mn: "Ажилладаг салбар", en: "Branch id", fk: branches.branch_id}
      department_code: {mn: "Хэлтсийн код", en: "Department code",
                        values: {LENDING: Зээлийн газар, RISK: Эрсдэлийн удирдлагын газар, FINANCE: "Санхүү, нягтлан бодох бүртгэл",
                                 COMPLIANCE: Нийцлийн алба, COLLECTION: Эргэн төлөлтийн алба, IT: Мэдээллийн технологи,
                                 OPERATIONS: Үйл ажиллагааны газар}}
      department_name: {mn: "Хэлтсийн нэр", en: "Department name", syn: [хэлтэс, алба]}
      position_code: {mn: "Албан тушаалын код", en: "Position code",
                      values: {CEO: Гүйцэтгэх захирал, BRANCH_MANAGER: Салбарын менежер, CREDIT_OFFICER: Зээлийн мэргэжилтэн,
                               RISK_ANALYST: Эрсдэлийн шинжээч, ACCOUNTANT: Нягтлан бодогч, TELLER: Кассч,
                               COLLECTOR: Эргэн төлөлтийн ажилтан, COMPLIANCE_OFF: Нийцлийн ажилтан}}
      position_name: {mn: "Албан тушаал", en: "Position name", syn: [албан тушаал]}
      manager_id: {mn: "Шууд удирдлага (ажилтны ID)", en: "Manager employee id", fk: employees.employee_id}
      hire_date: {mn: "Ажилд орсон огноо", en: "Hire date", syn: [ажилд орсон]}
      termination_date: {mn: "Ажлаас гарсан огноо", en: "Termination date", syn: [ажлаас гарсан]}
      employment_status: {mn: "Ажлын төлөв", en: "Employment status",
                          values: {ACTIVE: Ажиллаж байгаа, ON_LEAVE: Чөлөөтэй, SUSPENDED: Түдгэлзүүлсэн, TERMINATED: Ажлаас гарсан}}

  # ------------------------------------------------------------------ харилцагч
  customers:
    mn: "Харилцагч (хувь хүн ба байгууллага). Регистр, утас, хаяг, дансны дугаар энд БАЙХГҮЙ"
    en: "Customers (individuals and organizations); no register number, phone or address details"
    syn: [харилцагч, харилцагчид, үйлчлүүлэгч, зээлдэгч, хэрэглэгч, customer, client]
    pk: customer_id
    columns:
      customer_id: {mn: "Харилцагчийн дотоод ID", en: "Customer id"}
      customer_number: {mn: "Харилцагчийн дугаар (C00000123)", en: "Customer number", syn: [харилцагчийн дугаар]}
      customer_name: {mn: "Харилцагчийн нэр (хувь хүн: овог нэр, байгууллага: нэр)", en: "Customer display name",
                      syn: [нэр], pii: true}
      party_type: {mn: "Хувь хүн эсвэл байгууллага", en: "Party type",
                   values: {INDIVIDUAL: Хувь хүн, ORGANIZATION: Байгууллага (хуулийн этгээд)}}
      customer_type_code: {mn: "Харилцагчийн төрөл", en: "Customer type code",
                           values: {IND_SALARY: Цалинтай хувь хүн, IND_BUSINESS: Бизнес эрхлэгч хувь хүн,
                                    IND_PENSION: Тэтгэвэр авагч, ORG_SME: Жижиг дунд аж ахуйн нэгж (ЖДҮ),
                                    ORG_CORP: Томоохон байгууллага, ORG_NGO: Төрийн бус байгууллага}}
      customer_type_name: {mn: "Харилцагчийн төрлийн нэр", en: "Customer type name"}
      status_code: {mn: "Харилцагчийн төлөв", en: "Customer status code",
                    values: {PROSPECT: Боломжит харилцагч, ACTIVE: Идэвхтэй, INACTIVE: Идэвхгүй, SUSPENDED: Түдгэлзүүлсэн,
                             BLACKLIST: Хар жагсаалт, CLOSED: Хаагдсан}}
      status_name: {mn: "Харилцагчийн төлөвийн нэр", en: "Customer status name"}
      segment_code: {mn: "Сегмент (орлогын түвшин)", en: "Segment code",
                     values: {MASS: Энгийн, AFFLUENT: Дунд, PREMIUM: Дээд, VIP: VIP, SME: ЖДҮ, CORPORATE: Корпорэйт}}
      segment_name: {mn: "Сегментийн нэр", en: "Segment name", syn: [сегмент, ангилал]}
      branch_id: {mn: "Харьяалагдах салбар", en: "Home branch id", fk: branches.branch_id}
      relationship_manager_id: {mn: "Хариуцсан зээлийн мэргэжилтэн", en: "Relationship manager employee id",
                                fk: employees.employee_id, syn: [хариуцсан ажилтан]}
      kyc_status: {mn: "Харилцагчийг таних (KYC) төлөв", en: "KYC status",
                   values: {NOT_STARTED: Эхлээгүй, IN_PROGRESS: Шалгагдаж байгаа, VERIFIED: Баталгаажсан,
                            REJECTED: Татгалзсан, EXPIRED: Хугацаа дууссан}}
      aml_status: {mn: "Мөнгө угаалтын (AML) шалгалтын төлөв", en: "AML screening status",
                   values: {NOT_SCREENED: Шалгаагүй, CLEAR: Цэвэр, MATCH_PENDING: Тааралт шалгагдаж байгаа, BLOCKED: Хаагдсан}}
      risk_level: {mn: "Харилцагчийн эрсдэлийн түвшин (AML)", en: "Customer risk level",
                   values: {LOW: Бага, MEDIUM: Дунд, HIGH: Өндөр, CRITICAL: Маш өндөр}}
      is_pep: {mn: "Улс төрд нөлөө бүхий этгээд (PEP) эсэх", en: "Is politically exposed person"}
      is_blacklisted: {mn: "Хар жагсаалтад орсон эсэх", en: "Is blacklisted"}
      is_resident: {mn: "Резидент эсэх", en: "Is resident"}
      country_code: {mn: "Улсын код (MN, CN, RU, KR ...)", en: "Country code"}
      onboarded_date: {mn: "Харилцагч болсон огноо", en: "Onboarding date", syn: [бүртгүүлсэн, харилцагч болсон, шинэ харилцагч]}
      closed_date: {mn: "Харилцаа хаагдсан огноо", en: "Closing date"}
      province: {mn: "Үндсэн хаягийн аймаг/хот", en: "Province of primary address", syn: [аймаг, хот]}
      district: {mn: "Үндсэн хаягийн сум/дүүрэг", en: "District of primary address", syn: [дүүрэг, сум]}

  individuals:
    mn: "Хувь хүн харилцагчийн нэмэлт мэдээлэл (1:1 customers). Төрсөн огноо биш, нас ба төрсөн он"
    en: "Individual customer details (1:1 with customers): age, gender, job, income"
    syn: [хувь хүн, иргэн, хувь хүн харилцагч, individual]
    pk: customer_id
    columns:
      customer_id: {mn: "Харилцагчийн ID", en: "Customer id", fk: customers.customer_id}
      gender: {mn: "Хүйс", en: "Gender", values: {MALE: Эрэгтэй, FEMALE: Эмэгтэй, OTHER: Бусад}, syn: [хүйс, эрэгтэй, эмэгтэй]}
      birth_year: {mn: "Төрсөн он", en: "Birth year"}
      age: {mn: "Нас (ажлын өдрөөр тооцсон)", en: "Age in years as of business date", syn: [нас]}
      marital_status: {mn: "Гэрлэлтийн байдал", en: "Marital status",
                       values: {SINGLE: Ганц бие, MARRIED: Гэрлэсэн, DIVORCED: Салсан, WIDOWED: Бэлэвсэн}}
      dependants_count: {mn: "Асрамжийн хүний тоо", en: "Number of dependants"}
      education_level: {mn: "Боловсрол", en: "Education level"}
      occupation: {mn: "Мэргэжил/ажил", en: "Occupation", syn: [мэргэжил, ажил]}
      employer_name: {mn: "Ажил олгогч байгууллага", en: "Employer name", syn: [ажлын газар]}
      employment_type: {mn: "Хөдөлмөр эрхлэлтийн төрөл", en: "Employment type",
                        values: {EMPLOYED: Цалинтай ажилтан, SELF_EMPLOYED: Хувиараа хөдөлмөр эрхлэгч,
                                 BUSINESS_OWNER: Бизнес эрхлэгч, RETIRED: Тэтгэвэрт, STUDENT: Оюутан, UNEMPLOYED: Ажилгүй}}
      monthly_income: {mn: "Сарын орлого (₮)", en: "Monthly income", syn: [орлого, цалин, сарын орлого]}
      income_currency: {mn: "Орлогын валют", en: "Income currency"}

  organizations:
    mn: "Байгууллага харилцагчийн нэмэлт мэдээлэл (1:1 customers)"
    en: "Organization customer details (1:1 with customers)"
    syn: [байгууллага, компани, аж ахуйн нэгж, ААН, хуулийн этгээд, organization, company]
    pk: customer_id
    columns:
      customer_id: {mn: "Харилцагчийн ID", en: "Customer id", fk: customers.customer_id}
      org_name: {mn: "Байгууллагын нэр", en: "Legal name", syn: [компанийн нэр]}
      legal_form: {mn: "Хуулийн этгээдийн хэлбэр", en: "Legal form",
                   values: {LLC: ХХК, JSC: ХК, PARTNERSHIP: ХЗХ, SOLE_PROPRIETOR: Хувиараа, NGO: ТББ, STATE: Төрийн, COOPERATIVE: Хоршоо}}
      industry_code: {mn: "Үйл ажиллагааны салбарын код (ISIC: A01, F41, G47 ...)", en: "ISIC industry code"}
      industry_sector: {mn: "Үйл ажиллагааны салбар (монгол нэр)", en: "Industry sector name",
                        syn: [үйл ажиллагааны чиглэл, салбар (бизнес)]}
      establishment_date: {mn: "Үүсгэн байгуулагдсан огноо", en: "Establishment date"}
      employee_count: {mn: "Ажилчдын тоо", en: "Number of employees"}
      annual_revenue: {mn: "Жилийн борлуулалтын орлого (₮)", en: "Annual revenue", syn: [борлуулалт, жилийн орлого]}
      revenue_currency: {mn: "Орлогын валют", en: "Revenue currency"}

  # ------------------------------------------------------------------ бүтээгдэхүүн
  products:
    mn: "Бүтээгдэхүүн: зээл, хадгаламж, харилцах данс ба одоо мөрдөж буй хүү, хязгаар"
    en: "Products (loans, deposits, current accounts) with current rate and limits"
    syn: [бүтээгдэхүүн, зээлийн бүтээгдэхүүн, хадгаламжийн бүтээгдэхүүн, product]
    pk: product_id
    columns:
      product_id: {mn: "Бүтээгдэхүүний ID", en: "Product id"}
      product_code: {mn: "Бүтээгдэхүүний код", en: "Product code"}
      product_name: {mn: "Бүтээгдэхүүний нэр", en: "Product name", syn: [бүтээгдэхүүний нэр]}
      product_type_code: {mn: "Бүтээгдэхүүний төрөл", en: "Product type code",
                          values: {CONSUMER_LOAN: Хэрэглээний зээл, SALARY_LOAN: Цалингийн зээл, BUSINESS_LOAN: Бизнесийн зээл,
                                   MORTGAGE: Орон сууцны зээл, AUTO_LOAN: Автомашины зээл, PLEDGE_LOAN: Барьцаат хурдан зээл,
                                   AGRI_LOAN: Хөдөө аж ахуйн зээл, TERM_DEPOSIT: Хугацаатай хадгаламж,
                                   DEMAND_DEPOSIT: Хугацаагүй хадгаламж, CURRENT_ACC: Харилцах данс}}
      product_type_name: {mn: "Бүтээгдэхүүний төрлийн нэр", en: "Product type name"}
      category: {mn: "Ангилал", en: "Category", values: {LOAN: Зээл, DEPOSIT: Хадгаламж, CURRENT_ACCOUNT: Харилцах данс}}
      currency_code: {mn: "Валют", en: "Currency"}
      amortization_type: {mn: "Эргэн төлөлтийн арга", en: "Amortization type",
                          values: {ANNUITY: Тэнцүү төлөлт (аннуитет), EQUAL_PRINCIPAL: Үндсэн төлбөр тэнцүү,
                                   BULLET: Хугацааны эцэст нэг дор, INTEREST_ONLY: Зөвхөн хүү}}
      requires_collateral: {mn: "Барьцаа шаарддаг эсэх", en: "Requires collateral"}
      requires_guarantor: {mn: "Батлан даагч шаарддаг эсэх", en: "Requires guarantor"}
      min_credit_score: {mn: "Шаардлагатай доод скорингийн оноо", en: "Minimum credit score"}
      max_dti_ratio: {mn: "Өр/орлогын харьцааны (DTI) дээд хязгаар, %", en: "Max DTI ratio, %"}
      max_ltv_ratio: {mn: "Зээл/барьцааны харьцааны (LTV) дээд хязгаар, %", en: "Max LTV ratio, %"}
      launch_date: {mn: "Нэвтрүүлсэн огноо", en: "Launch date"}
      discontinue_date: {mn: "Зогсоосон огноо", en: "Discontinue date"}
      status: {mn: "Бүтээгдэхүүний төлөв", en: "Product status",
               values: {DRAFT: Ноорог, ACTIVE: Идэвхтэй, SUSPENDED: Түр зогссон, DISCONTINUED: Зогсоосон}}
      annual_rate: {mn: "Жилийн хүү, % (одоо мөрдөж буй)", en: "Current annual interest rate, %", syn: [хүү, хүүгийн хувь]}
      min_amount: {mn: "Доод дүн", en: "Minimum amount"}
      max_amount: {mn: "Дээд дүн", en: "Maximum amount"}
      min_term_months: {mn: "Доод хугацаа, сар", en: "Minimum term, months"}
      max_term_months: {mn: "Дээд хугацаа, сар", en: "Maximum term, months"}

  # ------------------------------------------------------------------ зээлийн хүсэлт
  loan_applications:
    mn: "Зээлийн хүсэлт, судалгаа ба шийдвэр. Батлагдаж гэрээ байгуулсан хүсэлтээс зээл (loans) үүснэ"
    en: "Loan applications and decisions; contracted applications become loans"
    syn: [зээлийн хүсэлт, хүсэлт, өргөдөл, зээлийн өргөдөл, application]
    pk: application_id
    columns:
      application_id: {mn: "Хүсэлтийн ID", en: "Application id"}
      application_no: {mn: "Хүсэлтийн дугаар (LA-2025-000123)", en: "Application number"}
      customer_id: {mn: "Хүсэлт гаргагч харилцагч", en: "Customer id", fk: customers.customer_id}
      product_id: {mn: "Хүссэн бүтээгдэхүүн", en: "Product id", fk: products.product_id}
      branch_id: {mn: "Хүлээн авсан салбар", en: "Branch id", fk: branches.branch_id}
      loan_officer_id: {mn: "Хариуцсан зээлийн мэргэжилтэн", en: "Loan officer employee id", fk: employees.employee_id}
      status_code: {mn: "Хүсэлтийн төлөв", en: "Application status code",
                    values: {DRAFT: Ноорог, SUBMITTED: Илгээгдсэн, UNDER_REVIEW: Судалгаанд, PENDING_DOCS: Баримт хүлээгдэж буй,
                             APPROVED: Батлагдсан, REJECTED: Татгалзсан, WITHDRAWN: Буцаан татсан, EXPIRED: Хугацаа дууссан,
                             CONTRACTED: Гэрээ байгуулсан}}
      status_name: {mn: "Хүсэлтийн төлөвийн нэр", en: "Application status name"}
      channel: {mn: "Хүсэлт ирсэн суваг", en: "Application channel",
                values: {BRANCH: Салбар, MOBILE: Мобайл апп, WEB: Вэб, AGENT: Агент, CALL_CENTER: Дуудлагын төв, PARTNER: Хамтрагч}}
      requested_amount: {mn: "Хүссэн дүн", en: "Requested amount", syn: [хүссэн дүн]}
      requested_term_months: {mn: "Хүссэн хугацаа, сар", en: "Requested term, months"}
      currency_code: {mn: "Валют", en: "Currency"}
