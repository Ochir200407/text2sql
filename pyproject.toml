[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mn-text2sql"
version = "0.1.0"
description = "Монгол хэл дээрх Text2SQL: мэдлэгийн давхарга, RAG, шалгалт/засвар, үнэлгээ, fine-tune (ББСБ PostgreSQL)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary>=2.9.9",
    "sqlglot==30.17.0",
    "PyYAML>=6.0",
    "numpy>=1.26",
    "rapidfuzz>=3.6",
    "scipy>=1.11",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42"]
embed = ["sentence-transformers>=3.0", "torch>=2.3"]
gpu = ["vllm", "transformers>=4.56", "peft>=0.12", "trl>=0.20", "datasets>=2.20", "accelerate>=0.33",
       "bitsandbytes>=0.45"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
t2s = "mn_text2sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mn_text2sql" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: PostgreSQL шаардлагатай тест (T2S_TEST_DSN орчны хувьсагч)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
